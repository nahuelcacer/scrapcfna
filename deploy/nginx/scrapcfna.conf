# /etc/nginx/sites-available/scrapcfna  (reemplazar api.midominio.com)
# Arranca solo con el puerto 80; `certbot --nginx -d api.midominio.com`
# agrega el bloque 443 y la redirección a https automáticamente.

server {
    listen 80;
    listen [::]:80;
    server_name api.midominio.com;

    client_max_body_size 1m;

    # Estáticos (resultado de `manage.py collectstatic`).
    location /static/ {
        alias /var/www/scrapcfna/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/scrapcfna/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django usa este header para saber que la conexión original es https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
